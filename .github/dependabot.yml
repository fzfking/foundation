version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /Documentation~/website
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      docs-dependencies:
        patterns: ['*']
