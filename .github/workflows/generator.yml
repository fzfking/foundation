name: TypedIds generator

on:
  push:
    branches: [main]
    paths: ['Generators~/**', 'Analyzers/**', '.github/workflows/generator.yml']
  pull_request:
    paths: ['Generators~/**', 'Analyzers/**', '.github/workflows/generator.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyzer-is-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: Generators~/TypedIds/global.json
      - name: Rebuild the generator
        working-directory: Generators~/TypedIds
        run: dotnet build -c Release -o ./bin
      - name: Compare with the committed analyzer
        run: |
          if ! cmp Generators~/TypedIds/bin/Foundation.TypedIds.Generator.dll Analyzers/Foundation.TypedIds.Generator.dll; then
            echo "::error::Analyzers/Foundation.TypedIds.Generator.dll does not match a build of Generators~/TypedIds. Run Generators~/TypedIds/build.sh and commit the result."
            exit 1
          fi
